<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>TabDock</title>
    <link rel="stylesheet" href="./popup.css">
    <script type="text/javascript" src="./popup.js"></script>
  </head>
  <body>
    <main class="panel">
      <header class="hero animate a1">
        <div>
          <h1>TabDock</h1>
          <p class="subtitle">Save links, capture open tabs, and reopen them in one click.</p>
        </div>
        <span id="status" class="badge" role="status" aria-live="polite" aria-atomic="true">0 links</span>
      </header>
      <label for="input" class="label animate a2">Link List</label>
      <textarea autofocus id="input" aria-label="Link list input" placeholder="https://example.com&#10;https://docs.example.com"></textarea>
      <div class="meta animate a3">
        <span id="summary" aria-live="polite" aria-atomic="true">Add URLs or capture your current tabs.</span>
        <span class="autosave">Autosave on</span>
      </div>
      <div class="actions animate a4">
        <button id="open" type="button" aria-label="Open links from list">Open Links</button>
        <button id="tabs" type="button" aria-label="Capture current tabs">Capture Tabs</button>
        <button id="clear" type="button" aria-label="Clear saved links">Clear</button>
      </div>
    </main>
  </body>
</html>
