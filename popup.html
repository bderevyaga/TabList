<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>TabList</title>
    <link rel="stylesheet" href="./popup.css">
    <script type="module" src="./popup/main.js"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header reveal reveal-step-1">
        <div>
          <h1>TabList</h1>
          <p class="popup-subtitle">Save, open, and manage tab links in one list.</p>
        </div>
        <span id="link-count" class="link-count-badge" role="status" aria-live="polite" aria-atomic="true">0 links</span>
      </header>
      <div class="link-list-header reveal reveal-step-2">
        <label for="link-list-input" class="section-label">Link List</label>
        <div class="link-list-tools">
          <button id="copy-links-button" type="button" aria-label="Copy link list to clipboard">Copy</button>
          <button id="clear-links-button" type="button" aria-label="Clear saved links">Clear</button>
        </div>
      </div>
      <textarea autofocus id="link-list-input" aria-label="Link list input" placeholder="https://example.com&#10;https://docs.example.com"></textarea>
      <div class="capture-filter reveal reveal-step-3">
        <label for="capture-filter-input" class="section-label">Capture Filter</label>
        <input id="capture-filter-input" type="text" aria-label="Filter captured tabs by URL regexp" placeholder="URL regexp, e.g. ^https://docs\\.example\\.com">
      </div>
      <div class="popup-meta reveal reveal-step-3">
        <span id="status-message" aria-live="polite" aria-atomic="true">Add URLs or capture your current tabs.</span>
        <span class="autosave-indicator">Autosave on</span>
      </div>
      <div class="primary-actions reveal reveal-step-4">
        <button id="open-links-button" type="button" aria-label="Open links from list">Open Links</button>
        <button id="capture-tabs-button" type="button" aria-label="Capture current tabs">Capture Tabs</button>
        <button id="close-listed-button" type="button" aria-label="Close tabs from list">Close Listed</button>
      </div>
    </main>
  </body>
</html>
